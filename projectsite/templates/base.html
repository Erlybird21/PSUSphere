{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSUSphere</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,Helvetica,sans-serif;background:#f4f6f9;color:#333}
        a{color:inherit;text-decoration:none}
        /* top bar */
        .topbar{background:#1e2a3a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 20px}
        .topbar .brand{font-weight:bold;font-size:1.1rem;letter-spacing:.5px}
        .topbar .top-actions{display:flex;align-items:center;gap:16px}
        .topbar .photo img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #fff}
        /* layout */
        .wrapper{display:flex;min-height:calc(100vh - 52px)}
        .sidebar{width:240px;background:#2c3e50;color:#cbd5e1;padding:20px 0;flex-shrink:0}
        .sidebar .u-img{text-align:center;margin-bottom:12px}
        .sidebar .u-img img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #3b82f6}
        .sidebar .u-name{text-align:center;font-size:.9rem;margin-bottom:18px;color:#e2e8f0}
        .sidebar .menu-label{font-size:.65rem;letter-spacing:.08em;color:#94a3b8;padding:8px 20px 4px;text-transform:uppercase}
        .sidebar ul{list-style:none}
        .sidebar li a{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;font-size:.9rem;color:#cbd5e1;border-left:3px solid transparent}
        .sidebar li a:hover{background:#34495e;color:#fff}
        .sidebar li.active a{background:#34495e;color:#fff;border-left-color:#3b82f6}
        .sidebar li a .badge{font-size:.65rem;background:#e74c3c;color:#fff;border-radius:10px;padding:2px 7px}
        .sidebar li a .badge.green{background:#27ae60}
        .sidebar li a .badge.gray{background:#7f8c8d}
        .main{flex:1;padding:24px}
        .card{background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:hidden}
        .card-header{padding:16px 20px;border-bottom:1px solid #eef2f7;display:flex;align-items:center;justify-content:space-between}
        .card-title{font-weight:bold}
        .card-category{font-size:.8rem;color:#64748b}
        .card-body{padding:20px}
        table{width:100%;border-collapse:collapse;font-size:.9rem}
        th,td{padding:10px 8px;text-align:left;border-bottom:1px solid #eef2f7}
        th{background:#f8fafc;color:#475569;font-weight:600}
        .btn{display:inline-block;padding:7px 14px;border-radius:20px;border:none;cursor:pointer;font-size:.8rem}
        .btn-primary{background:#3b82f6;color:#fff}
        .btn-success{background:#22c55e;color:#fff}
        .btn-danger{background:#ef4444;color:#fff}
        .btn-rounded{border-radius:20px}
        .text-danger{color:#ef4444}
        .form-group{margin-bottom:14px}
        .form-group label{display:block;font-size:.82rem;margin-bottom:4px;color:#334155;font-weight:600}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:4px;font-size:.9rem}
        .form-group .helptext{font-size:.75rem;color:#64748b}
        .errorlist{list-style:none;color:#ef4444;font-size:.78rem;margin:4px 0 0}
        .pagination{display:flex;gap:6px;justify-content:center;margin-top:16px;flex-wrap:wrap}
        .pagination a,.pagination span{padding:6px 11px;border:1px solid #cbd5e1;border-radius:4px;font-size:.82rem;background:#fff}
        .pagination span.current{background:#3b82f6;color:#fff;border-color:#3b82f6}
        .alert{padding:10px 14px;border-radius:4px;margin-bottom:14px}
        .img-circle{border-radius:50%}
        /* search ui placeholder */
        .search-box input{padding:6px 10px;border-radius:4px;border:1px solid #cbd5e1;font-size:.85rem}
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand">PSUSphere</div>
        <div class="top-actions">
            <form class="navbar-left navbar-form nav-search mr-md-3" action="{% url 'organization-list' %}" method="get">
                <div class="search-box"><input type="text" placeholder="Search ..." class="form-control" name="q" value="{{ request.GET.q }}"></div>
            </form>
            <div class="photo">
                <img src="{% static 'img/profile.jpg' %}" alt="user-img">
            </div>
            <img src="{% static 'img/profile.jpg' %}" alt="user-img" width="36" class="img-circle" style="width:36px;height:36px;border-radius:50%;object-fit:cover;">
        </div>
    </div>
    <div class="wrapper">
        <nav class="sidebar">
            <div class="u-img"><img src="{% static 'img/profile.jpg' %}" alt="user"></div>
            <div class="u-name">Administrator</div>
            <div class="menu-label">Navigation</div>
            <ul>
                <li class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}"><a href="{% url 'home' %}">Dashboard <span class="badge green">5</span></a></li>
                <li><a href="#">Components</a></li>
                <li class="{% if request.resolver_match.url_name|slice:':12' == 'organization' %}active{% endif %}"><a href="{% url 'organization-list' %}">Organization</a></li>
                <li><a href="#">Forms</a></li>
                <li class="{% if request.resolver_match.url_name|slice:':9' == 'orgmember' %}active{% endif %}"><a href="{% url 'orgmember-list' %}">Org. Members <span class="badge">3</span></a></li>
                <li><a href="#">Tables</a></li>
                <li class="{% if request.resolver_match.url_name|slice:':7' == 'student' %}active{% endif %}"><a href="{% url 'student-list' %}">Student</a></li>
                <li><a href="#">Notifications <span class="badge gray">4</span></a></li>
                <li class="{% if request.resolver_match.url_name|slice:':7' == 'college' %}active{% endif %}"><a href="{% url 'college-list' %}">College</a></li>
                <li class="{% if request.resolver_match.url_name|slice:':7' == 'program' %}active{% endif %}"><a href="{% url 'program-list' %}">Program</a></li>
            </ul>
        </nav>
        <main class="main">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
